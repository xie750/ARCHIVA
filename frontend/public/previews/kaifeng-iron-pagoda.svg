    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a86d4e"/><stop offset=".48" stop-color="#754331"/><stop offset="1" stop-color="#4c2d28"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3d2827"/><stop offset=".52" stop-color="#c08b5a"/><stop offset="1" stop-color="#422b2a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edc37b"/><stop offset="1" stop-color="#9d6540"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
