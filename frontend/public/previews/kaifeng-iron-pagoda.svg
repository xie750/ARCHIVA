      <path d="M-46 25 L46 25 L36 31 L-36 31 Z" fill="#2f2525" stroke="#c48d5c" stroke-opacity=".65" stroke-width="1.2"/>
      <path d="M-48 -1 L-41 -12 M48 -1 L41 -12" stroke="#e0b779" stroke-width="2" stroke-linecap="round"/>
    </g>
