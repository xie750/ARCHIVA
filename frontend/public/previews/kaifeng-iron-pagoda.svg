<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Kaifeng Iron Pagoda schematic preview</title>
  <desc id="desc">A slender thirteen-storey glazed-brick pagoda elevation, shown as an architectural reconstruction schematic.</desc>
  <defs>
